# ==========================================
# LIAS Laboratory System - Spring Boot Config
# ==========================================
server.port=8080
server.servlet.context-path=/

# H2 In-Memory Database (Activé par défaut pour test instantané sans installation)
spring.datasource.url=jdbc:h2:mem:liasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Secret & Expiration (24h)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# CORS settings for frontend React
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Archivage documentaire (section 10) : dossier de stockage et taille maximale des fichiers
lab.storage.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
