<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <filter id="badge-shadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left: Brain & Circuit Emblem (x: 0 to 220, y: 15 to 225) -->
  <g transform="translate(10, 10)">
    <!-- LEFT HALF: CEREBRAL BRAIN (Grey) -->
    <g fill="#94a3b8" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main brain lobes / outer contour -->
      <path d="M 110 20 
               C 85 20, 60 30, 45 45
               C 25 65, 15 90, 15 115
               C 15 130, 20 145, 30 158
               C 22 170, 25 185, 35 195
               C 48 208, 70 215, 90 215
               C 100 215, 105 212, 110 210
               L 110 20 Z" 
            fill="#f1f5f9" stroke="#94a3b8" stroke-width="3" />
      
      <!-- Brain gyri & sulci folds -->
      <path d="M 45 60 C 60 70, 80 65, 95 55" fill="none" stroke="#94a3b8" stroke-width="4" />
      <path d="M 30 95 C 45 90, 70 95, 85 85 C 95 80, 105 85, 110 88" fill="none" stroke="#94a3b8" stroke-width="4" />
      <path d="M 25 125 C 40 120, 55 135, 75 125 C 90 118, 100 120, 110 118" fill="none" stroke="#94a3b8" stroke-width="4" />
      <path d="M 35 155 C 50 150, 65 160, 80 150 C 95 142, 105 148, 110 145" fill="none" stroke="#94a3b8" stroke-width="4" />
      <path d="M 45 185 C 60 178, 80 185, 95 178 C 102 175, 108 178, 110 176" fill="none" stroke="#94a3b8" stroke-width="4" />
      
      <!-- Brain surface dots / stipples -->
      <circle cx="55" cy="45" r="2.5" fill="#94a3b8" stroke="none" />
      <circle cx="75" cy="38" r="2.5" fill="#94a3b8" stroke="none" />
      <circle cx="40" cy="80" r="2.5" fill="#94a3b8" stroke="none" />
      <circle cx="60" cy="108" r="2.5" fill="#94a3b8" stroke="none" />
      <circle cx="48" cy="140" r="2.5" fill="#94a3b8" stroke="none" />
      <circle cx="68" cy="168" r="2.5" fill="#94a3b8" stroke="none" />
      <circle cx="55" cy="198" r="2.5" fill="#94a3b8" stroke="none" />
      <circle cx="85" cy="202" r="2.5" fill="#94a3b8" stroke="none" />
    </g>

    <!-- RIGHT HALF: DIGITAL CIRCUIT BOARD (Cyan / Electric Blue) -->
    <g stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Circuit central spine -->
      <line x1="110" y1="20" x2="110" y2="210" stroke="#0ea5e9" stroke-width="4" />

      <!-- Circuit Traces & Nodes -->
      <!-- Branch 1 (Top) -->
      <path d="M 110 35 L 140 35 L 155 50 L 180 50" />
      <circle cx="180" cy="50" r="4.5" fill="#0284c7" stroke="none" />

      <path d="M 110 60 L 130 60 L 145 75 L 170 75" />
      <circle cx="170" cy="75" r="4" fill="#0284c7" stroke="none" />

      <!-- Branch 2 (Upper Middle) -->
      <path d="M 110 85 L 125 85 L 138 98 L 155 98" />
      <circle cx="155" cy="98" r="3.5" fill="#0ea5e9" stroke="none" />

      <!-- Microchip / Integrated Circuit (x: 165, y: 95, w: 32, h: 48) -->
      <g>
        <rect x="162" y="96" width="34" height="46" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="3" />
        <rect x="170" y="104" width="18" height="30" rx="2" fill="#0284c7" stroke="none" />
        <!-- Chip pins -->
        <line x1="156" y1="104" x2="162" y2="104" stroke="#0284c7" stroke-width="2.5" />
        <line x1="156" y1="114" x2="162" y2="114" stroke="#0284c7" stroke-width="2.5" />
        <line x1="156" y1="124" x2="162" y2="124" stroke="#0284c7" stroke-width="2.5" />
        <line x1="156" y1="134" x2="162" y2="134" stroke="#0284c7" stroke-width="2.5" />
        
        <line x1="196" y1="104" x2="202" y2="104" stroke="#0284c7" stroke-width="2.5" />
        <line x1="196" y1="114" x2="202" y2="114" stroke="#0284c7" stroke-width="2.5" />
        <line x1="196" y1="124" x2="202" y2="124" stroke="#0284c7" stroke-width="2.5" />
        <line x1="196" y1="134" x2="202" y2="134" stroke="#0284c7" stroke-width="2.5" />
      </g>

      <!-- Connection from Chip to Bus -->
      <path d="M 202 114 L 214 114 L 218 125" />
      <circle cx="218" cy="125" r="3.5" fill="#0284c7" stroke="none" />

      <!-- Branch 3 (Lower Middle) -->
      <path d="M 110 140 L 135 140 L 148 152 L 180 152" />
      <circle cx="180" cy="152" r="4.5" fill="#0284c7" stroke="none" />

      <!-- Branch 4 (Bottom) -->
      <path d="M 110 165 L 125 165 L 140 180 L 165 180" />
      <circle cx="165" cy="180" r="4" fill="#0ea5e9" stroke="none" />

      <path d="M 110 190 L 135 190 L 150 202 L 185 202" />
      <circle cx="185" cy="202" r="4.5" fill="#0284c7" stroke="none" />

      <!-- Small internal nodes -->
      <circle cx="132" cy="60" r="3" fill="#0284c7" stroke="none" />
      <circle cx="140" cy="140" r="3" fill="#0284c7" stroke="none" />
    </g>
  </g>

  <!-- LIAS BIG BOLD TYPOGRAPHY (x: 230 to 890, y: 195) -->
  <g fill="#0f172a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Impact', sans-serif" font-weight="900" font-size="210" letter-spacing="-3">
    <!-- L -->
    <text x="235" y="195">L</text>
    <!-- I -->
    <text x="365" y="195">I</text>
    <!-- A -->
    <text x="460" y="195">A</text>
    <!-- S -->
    <text x="645" y="195">S</text>
  </g>

  <!-- TRANSVERSAL WHITE BANNER WITH TEXT -->
  <g transform="translate(195, 108)" filter="url(#badge-shadow)">
    <!-- White badge card -->
    <rect x="0" y="0" width="675" height="34" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <!-- Subtitle text in all-caps tracked -->
    <text x="337" y="23" 
          fill="#0f172a" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
          font-weight="800" 
          font-size="16.5" 
          letter-spacing="5.5" 
          text-anchor="middle">
      LABORATOIRE D'INTELLIGENCE ARTIFICIELLE ET SYSTEMES
    </text>
  </g>
</svg>
